name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: [ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The registry login below carries its own credentials; nothing here
          # pushes to git, so don't leave a token in .git/config.
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/invictus
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Content is never part of the build context or the image (see .dockerignore) —
      # it's bind-mounted at deploy time, so this build needs no secrets at all.
      #
      # Built into the local daemon first so it can be started before anything
      # is tagged :latest. CI proves the source compiles and its tests pass; it
      # cannot prove the *image* boots — a mistraced standalone bundle or a bad
      # CMD only shows up when the container runs. The push below reuses this
      # same cached build, so verifying costs a container start, not a rebuild.
      - name: Build the image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: production
          load: true
          tags: invictus:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No content is mounted on purpose: /api/health is content-independent, so
      # this checks the server itself rather than the deployment's JSON.
      - name: Verify the image starts and serves
        run: |
          docker run -d --name verify -p 3000:3000 invictus:verify
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/api/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker logs verify
          docker rm -f verify
          if [ -z "${healthy:-}" ]; then
            echo "::error::image did not become healthy; not publishing"
            exit 1
          fi

      - name: Publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
