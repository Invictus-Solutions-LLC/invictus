services:
  invictus:
    image: invictus-solutions-llc/invictus:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: invictus
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - RESEND_TO_EMAIL=${RESEND_TO_EMAIL:-}
      - RESUME_ACCESS_TOKENS=${RESUME_ACCESS_TOKENS:-}
      # Optional: enables /api/ask. Empty means the ⌘K palette stays a plain
      # navigator, which is the intended fallback.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
    ports:
      # Loopback by default, matching the production service. The dev stack is
      # handed real RESEND_API_KEY, ANTHROPIC_API_KEY and RESUME_ACCESS_TOKENS,
      # so a bare "3000:3000" published it to every device on the network —
      # anyone on the same wifi could send mail on your account or spend your
      # model credits. Set DEV_BIND=0.0.0.0 when you deliberately want to reach
      # the dev server from a phone on the same network.
      - "${DEV_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ./src/:/app/src/
      - ./public/:/app/public/
      - ./content/:/app/content/
    # depends_on:
    #   - serviceName